<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B3DF5"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <!-- Building body -->
  <rect x="6" y="10" width="20" height="19" rx="1.2" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
  <!-- Roof cap -->
  <rect x="4" y="8.5" width="24" height="2.2" rx="1" fill="white" fill-opacity="0.9"/>
  <!-- Windows row 1 -->
  <rect x="9" y="14" width="5" height="3.5" rx="0.6" fill="white" fill-opacity="0.95"/>
  <rect x="18" y="14" width="5" height="3.5" rx="0.6" fill="white" fill-opacity="0.95"/>
  <!-- Windows row 2 -->
  <rect x="9" y="20" width="5" height="3.5" rx="0.6" fill="white" fill-opacity="0.45"/>
  <rect x="18" y="20" width="5" height="3.5" rx="0.6" fill="white" fill-opacity="0.95"/>
  <!-- Door -->
  <rect x="13.5" y="24.5" width="5" height="4.5" rx="0.8" fill="white" fill-opacity="0.85"/>
</svg>
